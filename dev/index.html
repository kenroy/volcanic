<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volcanic editor harness</title>
<style>
  /* Rough stand-ins for Obsidian's theme variables. */
  body {
    --background-primary: #ffffff; --background-secondary: #f6f6f6;
    --background-modifier-border: #e0e0e0; --background-modifier-border-hover: #c9c9c9;
    --background-modifier-hover: rgba(0,0,0,.06);
    --text-normal: #222222; --text-muted: #5c5c5c; --text-faint: #ababab; --text-error: #c8253c;
    --text-on-accent: #ffffff; --interactive-accent: #7852ee;
    --font-interface: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-monospace: ui-monospace, Menlo, monospace;
    --font-ui-smaller: 12px; --font-ui-small: 13px; --font-ui-medium: 15px; --font-ui-large: 20px;
    --font-medium: 500; --font-semibold: 600;
    --radius-s: 4px; --radius-m: 8px; --radius-l: 12px;
    --size-2-2: 4px; --size-4-1: 4px; --size-4-2: 8px; --size-4-3: 12px; --size-4-4: 16px; --size-4-5: 20px;
    --size-4-6: 24px; --size-4-8: 32px; --size-4-12: 48px;
    --shadow-s: 0 2px 8px rgba(0,0,0,.15);
    margin: 0; background: #888; font-family: var(--font-interface); color: var(--text-normal);
  }
  body.theme-dark {
    --background-primary: #1e1e1e; --background-secondary: #262626;
    --background-modifier-border: #363636; --background-modifier-border-hover: #4a4a4a;
    --background-modifier-hover: rgba(255,255,255,.07);
    --text-normal: #dadada; --text-muted: #b3b3b3; --text-faint: #666; --text-error: #fb464c;
    --interactive-accent: #8a5cf5; background: #000;
  }
  button { font: inherit; font-size: var(--font-ui-small); color: var(--text-normal); background: var(--background-modifier-hover);
    border: 0; border-radius: 5px; padding: 4px 12px; height: 30px; box-shadow: 0 0 0 1px var(--background-modifier-border); }
  button.mod-cta { background: var(--interactive-accent); color: var(--text-on-accent); }
  button.mod-warning { color: var(--text-error); }
  select, input, textarea { font: inherit; font-size: var(--font-ui-small); color: var(--text-normal); background: var(--background-primary);
    border: 1px solid var(--background-modifier-border); border-radius: 5px; padding: 4px 8px; }
  #host { display: flex; height: 100vh; background: var(--background-primary); }
  #output { position: fixed; left: -9999px; }
  .harness-inline-outer { display: block; padding: 20px; overflow: auto; background: var(--background-primary); }
  .harness-inline { width: var(--harness-width, 720px); margin: 0 auto; }
  .harness-notes { padding: 16px; max-width: 760px; margin: 0 auto; background: var(--background-primary); }
</style>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<div id="host"></div>
<pre id="output"></pre>
<script src="harness.js"></script>
</body>
</html>
